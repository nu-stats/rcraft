name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev pkg-config
      - name: Read the R pins
        id: pins
        shell: bash
        run: |
          echo "r=$(grep '^R_VERSION=' ENVIRONMENT | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "snapshot=$(grep '^PACKAGE_SNAPSHOT=' ENVIRONMENT | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.pins.outputs.r }}
          use-public-rspm: true
      - name: Use the pinned R everywhere
        shell: bash
        run: |
          # runner images carry other R versions; the finder lists the newest
          # first unless R_HOME says which one to use
          echo "R_HOME=$(Rscript -e 'cat(R.home())')" >> "$GITHUB_ENV"
          Rscript --version
      - name: R packages the file-format tests use
        shell: bash
        env:
          SNAPSHOT: ${{ steps.pins.outputs.snapshot }}
        run: |
          set -o pipefail
          # the dated snapshot in ENVIRONMENT, so the packages match the pinned R
          if [ "$RUNNER_OS" = "Linux" ]; then
            export REPO="https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/$SNAPSHOT"
          else
            export REPO="https://packagemanager.posit.co/cran/$SNAPSHOT"
          fi
          echo "package repository: $REPO"
          Rscript -e 'install.packages(c("readxl", "haven", "arrow"), repos = Sys.getenv("REPO")); stopifnot(requireNamespace("readxl"), requireNamespace("haven"), requireNamespace("arrow"))' 2>&1 | tee pkgs.log || {
            tail -n 25 pkgs.log | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > pkgs-tail.txt
            echo "::error title=installing readxl, haven and arrow failed::$(cat pkgs-tail.txt)"
            exit 1
          }
      - name: Run cargo xtask ci
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo xtask ci 2>&1 | tee ci.log || {
            # put the end of the log in an annotation, which can be read
            # without signing in to GitHub
            grep -vE 'cargo:rerun-if|^ +(Compiling|Checking|Fresh|Downloaded|Downloading|Updating|Locking|Blocking) ' ci.log | tail -n 25 | cut -c1-200 | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > ci-tail.txt
            echo "::error title=cargo xtask ci failed::$(cat ci-tail.txt)"
            exit 1
          }
      - run: cargo run -p rcraft-cli -- --version
