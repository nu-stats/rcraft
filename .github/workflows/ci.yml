name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Read the R pins
        id: pins
        shell: bash
        run: |
          echo "r=$(grep '^R_VERSION=' ENVIRONMENT | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "snapshot=$(grep '^PACKAGE_SNAPSHOT=' ENVIRONMENT | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.pins.outputs.r }}
          use-public-rspm: true
      - run: cargo xtask ci
      - run: cargo run -p rcraft-cli -- --version
