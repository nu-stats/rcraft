[package]
name = "rcraft-ui-egui"
description = "The desktop interface panes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.rcraft]
layer = 6

[dependencies]
rcraft-core.workspace = true
rcraft-engine.workspace = true
rcraft-rcodegen.workspace = true
rcraft-rdata.workspace = true
rcraft-rhost.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui-winit = "0.29"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland"] }

[lints]
workspace = true
