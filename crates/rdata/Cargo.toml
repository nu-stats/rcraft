[package]
name = "rcraft-rdata"
description = "Moves data frames between R and RCraft without copying whole tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.rcraft]
layer = 2

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
rcraft-core.workspace = true
rcraft-rproto.workspace = true
ruzstd = "0.8"

[lints]
workspace = true
