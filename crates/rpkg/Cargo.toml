[package]
name = "rcraft-rpkg"
description = "The CRAN package index: read, cache and search offline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.rcraft]
layer = 2

[dependencies]
rcraft-core.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The network fetcher. A browser build (P8.5) fetches through the page instead,
# and rustls's ring does not build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true
